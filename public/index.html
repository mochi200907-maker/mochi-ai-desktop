<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi AI Robot Face</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100%; }
    body { background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; }

    #robot-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    #status-bar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 10;
    }
    .waveform-bar {
      width: 4px;
      height: 6px;
      background: #00d2ff;
      border-radius: 3px;
      transform-origin: center;
      transition: height 0.08s ease, background 0.3s ease;
    }
    #state-text {
      color: #00d2ff;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-left: 6px;
      opacity: 0.7;
    }

    #transcript-bar {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      max-width: 88vw;
      background: rgba(0,0,0,0.72);
      border: 1px solid #00d2ff44;
      border-radius: 20px;
      padding: 7px 20px;
      color: #cce8ff;
      font-size: 13px;
      text-align: center;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #transcript-bar.visible { opacity: 1; }

    #error-toast {
      position: absolute;
      bottom: max(62px, calc(env(safe-area-inset-bottom) + 46px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(180,30,30,0.85);
      border: 1px solid #ff4444;
      border-radius: 14px;
      padding: 7px 18px;
      color: #ffaaaa;
      font-size: 12px;
      text-align: center;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #error-toast.visible { opacity: 1; }

    #start-overlay {
      position: absolute;
      z-index: 99;
      background: rgba(0,0,0,0.92);
      color: white;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    button { padding: 12px 24px; font-size: 18px; border-radius: 30px; border: none; background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
    button:hover { transform: scale(1.05); }

    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: none;
    }
    #flash-overlay.flash-active {
      animation: cameraFlash 0.55s ease-out forwards;
    }
    @keyframes cameraFlash {
      0%   { opacity: 0; }
      8%   { opacity: 1; }
      100% { opacity: 0; }
    }

    #photo-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.82);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
    }
    #photo-modal.open { display: flex; }
    #photo-modal img {
      max-width: min(90vw, 480px);
      max-height: 55vh;
      border-radius: 18px;
      border: 3px solid #00d2ff;
      box-shadow: 0 0 40px #00d2ff88;
      object-fit: cover;
    }
    #photo-modal .modal-label {
      color: #00d2ff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
    }
    #photo-modal .modal-btns {
      display: flex;
      gap: 16px;
    }
    #photo-modal .btn-save {
      background: #00d2ff;
      color: #000;
    }
    #photo-modal .btn-discard {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.25);
    }

    #video-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 250;
      background: rgba(0,0,0,0.96);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 14px;
      padding: max(12px, env(safe-area-inset-top))
               max(12px, env(safe-area-inset-right))
               max(12px, env(safe-area-inset-bottom))
               max(12px, env(safe-area-inset-left));
    }
    #video-modal.open { display: flex; }
    #video-frame {
      width: min(94vw, calc((100dvh - 112px) * 16 / 9), 960px);
      max-width: 100%;
      max-height: calc(100dvh - 112px);
      aspect-ratio: 16 / 9;
      border: 1px solid #ff4fd888;
      border-radius: 14px;
      background: #050509;
    }
    #tiktok-video {
      display: none;
      width: min(94vw, calc((100dvh - 112px) * 9 / 16), 520px);
      max-width: 100%;
      max-height: calc(100dvh - 112px);
      aspect-ratio: 9 / 16;
      border: 1px solid #ff4fd888;
      border-radius: 14px;
      background: #050509;
      object-fit: contain;
    }
    #video-modal .video-title {
      max-width: 90vw;
      color: #ffb8f0;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    #video-modal .video-stop {
      background: #ff4fd8;
      color: #170013;
      font-size: 14px;
      padding: 10px 24px;
    }

    @media (max-height: 520px) {
      #video-modal { gap: 8px; }
      #video-frame {
        width: min(94vw, calc((100dvh - 98px) * 16 / 9), 960px);
        max-height: calc(100dvh - 98px);
      }
      #tiktok-video {
        width: min(94vw, calc((100dvh - 98px) * 9 / 16), 360px);
        max-height: calc(100dvh - 98px);
      }
      #video-modal .video-title { font-size: 12px; }
      #video-modal .video-stop { padding: 8px 20px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1>Mochi AI Robot Interface</h1>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px;">
      <label style="color:#888;font-size:12px;letter-spacing:1px;text-transform:uppercase;">BLE Device Name</label>
      <input id="ble-name-input" type="text" value="MOCHI_ESP32_ROBOT"
        style="background:#1a1a2e;border:1px solid #00d2ff55;border-radius:8px;color:#00d2ff;
               font-size:13px;padding:7px 14px;text-align:center;width:230px;outline:none;" />
    </div>
    <button id="connect-btn">Connect ESP32 &amp; Start Robot</button>
    <button id="voiceonly-btn" style="background: rgba(255,255,255,0.15); color: #fff; margin-top: -8px; font-size: 14px; padding: 10px 22px;">Start without Robot (Voice only)</button>
  </div>

  <div id="flash-overlay"></div>

  <div id="photo-modal">
    <div class="modal-label">📸 Photo captured!</div>
    <img id="photo-preview" src="" alt="Captured photo" />
    <div class="modal-btns">
      <button class="btn-save" id="btn-save-photo">Save</button>
      <button class="btn-discard" id="btn-discard-photo">Discard</button>
    </div>
  </div>

  <div id="video-modal">
    <iframe id="video-frame" title="Mochi video player"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <video id="tiktok-video" playsinline controls></video>
    <div class="video-title" id="video-title"></div>
    <button class="video-stop" id="video-stop">■ Stop video</button>
  </div>

  <div id="robot-screen">
    <div id="status-bar">
      <div class="waveform-bar" id="wb1"></div>
      <div class="waveform-bar" id="wb2"></div>
      <div class="waveform-bar" id="wb3"></div>
      <div class="waveform-bar" id="wb4"></div>
      <div class="waveform-bar" id="wb5"></div>
      <div class="waveform-bar" id="wb6"></div>
      <div class="waveform-bar" id="wb7"></div>
      <span id="state-text">IDLE</span>
    </div>

    <div id="transcript-bar"></div>
    <div id="error-toast"></div>
    <canvas id="faceCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('faceCanvas');
    const ctx = canvas.getContext('2d');
    function viewportSize() {
      const root = document.getElementById('robot-screen');
      const visual = window.visualViewport;
      return {
        width: Math.max(1, Math.round(root?.clientWidth || visual?.width || window.innerWidth)),
        height: Math.max(1, Math.round(root?.clientHeight || visual?.height || window.innerHeight)),
      };
    }
    function resize() {
      const size = viewportSize();
      canvas.width = size.width;
      canvas.height = size.height;
    }
    window.addEventListener('resize', resize);
    window.visualViewport?.addEventListener('resize', resize);
    window.visualViewport?.addEventListener('scroll', resize);
    resize();

    let currentExpression = 'IDLE';
    let robotState = 'IDLE';

    // ── CAMERA FEATURE ────────────────────────────────────────────
    let cameraAnimPhase = 'none';
    let cameraAnimY = 0;
    let cameraAnimTarget = 0;
    let cameraCaptured = false;

    function playCameraShutter() {
      try {
        const sCtx = new (window.AudioContext || window.webkitAudioContext)();
        const sampleRate = sCtx.sampleRate;
        const clickLen = Math.floor(sampleRate * 0.06);
        const clickBuf = sCtx.createBuffer(1, clickLen, sampleRate);
        const clickData = clickBuf.getChannelData(0);
        for (let i = 0; i < clickLen; i++) {
          clickData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * 0.008));
        }
        const tailLen = Math.floor(sampleRate * 0.12);
        const tailBuf = sCtx.createBuffer(1, tailLen, sampleRate);
        const tailData = tailBuf.getChannelData(0);
        for (let i = 0; i < tailLen; i++) {
          tailData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * 0.03)) * 0.35;
        }
        const clickSrc = sCtx.createBufferSource();
        clickSrc.buffer = clickBuf;
        const tailSrc = sCtx.createBufferSource();
        tailSrc.buffer = tailBuf;
        const gain = sCtx.createGain();
        gain.gain.value = 0.7;
        clickSrc.connect(gain); tailSrc.connect(gain);
        gain.connect(sCtx.destination);
        clickSrc.start(0);
        tailSrc.start(sCtx.currentTime + 0.03);
      } catch(e) { console.warn('Shutter sound error', e); }
    }

    async function triggerCameraCapture() {
      if (cameraAnimPhase !== 'none' || cameraCaptured) return;
      cameraCaptured = true;
      cameraAnimPhase = 'raising';
      cameraAnimY = 320;
      cameraAnimTarget = 0;
      await new Promise(r => setTimeout(r, 750));

      let videoStream;
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      } catch(err) {
        console.warn('Camera access denied:', err);
        cameraAnimPhase = 'lowering';
        await new Promise(r => setTimeout(r, 500));
        cameraAnimPhase = 'none';
        cameraCaptured = false;
        currentExpression = 'IDLE';
        return;
      }

      const video = document.createElement('video');
      video.srcObject = videoStream;
      video.playsInline = true;
      await video.play();
      await new Promise(r => setTimeout(r, 400));

      const flashEl = document.getElementById('flash-overlay');
      flashEl.classList.remove('flash-active');
      void flashEl.offsetWidth;
      flashEl.classList.add('flash-active');
      playCameraShutter();

      const cap = document.createElement('canvas');
      cap.width = video.videoWidth || 640;
      cap.height = video.videoHeight || 480;
      const capCtx = cap.getContext('2d');
      capCtx.translate(cap.width, 0);
      capCtx.scale(-1, 1);
      capCtx.drawImage(video, 0, 0);
      videoStream.getTracks().forEach(t => t.stop());

      await new Promise(r => setTimeout(r, 350));
      cameraAnimPhase = 'lowering';
      cameraAnimTarget = 320;
      await new Promise(r => setTimeout(r, 500));
      cameraAnimPhase = 'none';
      cameraAnimY = 320;
      currentExpression = 'HAPPY';

      const photoDataURL = cap.toDataURL('image/jpeg', 0.92);
      document.getElementById('photo-preview').src = photoDataURL;
      document.getElementById('photo-modal').classList.add('open');
      document.getElementById('btn-save-photo').dataset.photoUrl = photoDataURL;
      cameraCaptured = false;
    }

    document.getElementById('btn-save-photo').addEventListener('click', () => {
      const url = document.getElementById('btn-save-photo').dataset.photoUrl;
      if (!url) return;
      const a = document.createElement('a');
      a.href = url;
      a.download = `mochi_photo_${Date.now()}.jpg`;
      a.click();
      document.getElementById('photo-modal').classList.remove('open');
    });

    document.getElementById('btn-discard-photo').addEventListener('click', () => {
      document.getElementById('photo-modal').classList.remove('open');
      document.getElementById('photo-preview').src = '';
    });

    function drawCameraAccessory(cx, cy) {
      if (cameraAnimPhase === 'none') return;
      const speed = 0.14;
      cameraAnimY += (cameraAnimTarget - cameraAnimY) * speed;
      const camX = cx;
      const camY = cy + 220 + cameraAnimY;
      ctx.save();
      ctx.translate(camX, camY);
      const bob = cameraAnimPhase === 'held' ? Math.sin(Date.now() * 0.005) * 4 : 0;
      ctx.translate(0, bob);
      const bw = 130, bh = 78, br = 14;
      const lensR = 26;
      ctx.shadowColor = '#00d2ff';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.roundRect(-bw / 2, -bh / 2, bw, bh, br);
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.roundRect(-22, -bh / 2 - 18, 44, 22, [8, 8, 0, 0]);
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(10, 4, lensR + 6, 0, Math.PI * 2);
      ctx.fillStyle = '#0d0d1a';
      ctx.fill();
      ctx.strokeStyle = '#3ad8ff';
      ctx.lineWidth = 3;
      ctx.stroke();
      const lensGrad = ctx.createRadialGradient(6, 0, 2, 10, 4, lensR);
      lensGrad.addColorStop(0, '#2a4a8a');
      lensGrad.addColorStop(0.5, '#0d1a3a');
      lensGrad.addColorStop(1, '#020a1a');
      ctx.beginPath();
      ctx.arc(10, 4, lensR, 0, Math.PI * 2);
      ctx.fillStyle = lensGrad;
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(3, -4, lensR * 0.45, lensR * 0.28, -0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(bw / 2 - 20, -bh / 2 + 10, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#ff5e97';
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(-bw / 2 + 12, -bh / 2 + 10, 18, 10, 4);
      ctx.fillStyle = '#fffde7';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.roundRect(bw / 2 - 44, -bh / 2 + 14, 24, 16, 3);
      ctx.fillStyle = '#00d2ff33';
      ctx.strokeStyle = '#00d2ff88';
      ctx.lineWidth = 1.5;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // ── SILENT CAPTURE (front camera) for vision tool ───────────
    async function capturePhotoSilent() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.playsInline = true;
        await video.play();
        await new Promise(r => setTimeout(r, 500));
        const cap = document.createElement('canvas');
        cap.width = video.videoWidth || 640;
        cap.height = video.videoHeight || 480;
        const capCtx = cap.getContext('2d');
        capCtx.translate(cap.width, 0);
        capCtx.scale(-1, 1);
        capCtx.drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());
        return cap.toDataURL('image/jpeg', 0.85);
      } catch (err) {
        console.warn('Silent capture failed:', err.message);
        return null;
      }
    }

    // ── ENVIRONMENT CAPTURE (rear camera) for navigation ────────
    async function captureEnvironmentPhoto() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.playsInline = true;
        await video.play();
        await new Promise(r => setTimeout(r, 600));
        const cap = document.createElement('canvas');
        cap.width = video.videoWidth || 640;
        cap.height = video.videoHeight || 480;
        cap.getContext('2d').drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());
        return cap.toDataURL('image/jpeg', 0.85);
      } catch (err) {
        console.warn('[Nav] env camera failed, falling back to front:', err.message);
        return capturePhotoSilent();
      }
    }

    // ── NAVIGATE TO TARGET (called by server tool request) ──────
    async function navigateToTarget(target, toolCallId) {
      const MAX_SCANS = 3;
      let found = false;
      robotState = 'THINKING';
      currentExpression = 'SCANNING';
      sendBLECommand('LED_CYAN');

      for (let attempt = 0; attempt < MAX_SCANS; attempt++) {
        showTranscript(`🔍 Scanning for "${target}"… (${attempt + 1}/${MAX_SCANS})`);
        const photo = await captureEnvironmentPhoto();
        if (!photo) { showError('Camera unavailable for navigation'); break; }

        let direction = 'NOTFOUND';
        try {
          const navRes = await fetch('/api/vision/navigate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: photo, target })
          });
          if (navRes.ok) {
            const data = await navRes.json();
            direction = data.direction || 'NOTFOUND';
          }
        } catch (err) { console.warn('[Nav] API failed:', err.message); }

        console.log(`[Nav] scan ${attempt + 1}: target="${target}" direction=${direction}`);

        if (direction !== 'NOTFOUND') {
          found = true;
          showTranscript(`📍 Found "${target}" — ${direction}. Moving!`);
          sendDirectionalMove(direction === 'CENTER' ? 'FORWARD' : direction);
          await new Promise(r => setTimeout(r, direction === 'CENTER' ? 900 : 1400));
          currentExpression = 'HAPPY';
          sendBLECommand('LED_GREEN');
          break;
        }

        if (attempt < MAX_SCANS - 1) {
          showTranscript(`🔄 Not found yet, rotating…`);
          sendBLECommand('LEFT');
          await new Promise(r => setTimeout(r, 700));
        }
      }

      if (!found) {
        showTranscript(`❓ Can't find "${target}" nearby`);
        currentExpression = 'SAD';
      }

      if (geminiWs?.readyState === WebSocket.OPEN) {
        geminiWs.send(JSON.stringify({
          navigateResult: found
            ? `Successfully arrived at the ${target}`
            : `I looked around but couldn't find the ${target}. Can you point me toward it?`,
          toolCallId
        }));
      }

      setTimeout(() => {
        robotState = 'IDLE';
        if (!found) currentExpression = 'IDLE';
        sendBLECommand('LED_OFF');
      }, 1500);
    }

    // ── KEEP RENDER ALIVE ───────────────────────────────────────
    setInterval(() => fetch('/health').catch(() => {}), 4 * 60 * 1000);

    // ── MEDIA PLAYERS ────────────────────────────────────────────
    let musicAudio = null;
    let musicPlaying = false;
    let isMediaPlaying = false;

    function playMusicUrl(title, url) {
      stopMusic();
      isMediaPlaying = true;
      musicAudio = new Audio(url);
      musicAudio.playsInline = true;
      musicAudio.preload = 'auto';
      musicAudio.onended = () => { stopMusic(); setTimeout(() => { isMediaPlaying = false; }, 1500); };
      musicAudio.onerror = () => {
        console.warn('Music audio error, code:', musicAudio?.error?.code);
        showError('Music playback error');
        stopMusic();
        setTimeout(() => { isMediaPlaying = false; }, 1500);
      };
      musicAudio.play().catch(err => {
        showError('Music play: ' + err.message);
        stopMusic();
        setTimeout(() => { isMediaPlaying = false; }, 1500);
      });
      musicPlaying = true;
      showTranscript('🎵 ' + title);
      currentExpression = 'MUSIC';
    }

    function stopMusic() {
      if (musicAudio) {
        musicAudio.pause();
        musicAudio.src = '';
        musicAudio = null;
      }
      musicPlaying = false;
      if (currentExpression === 'MUSIC') currentExpression = 'IDLE';
    }

    function youtubeId(url) {
      try {
        const parsed = new URL(url);
        if (parsed.hostname.includes('youtu.be')) return parsed.pathname.slice(1);
        return parsed.searchParams.get('v') || parsed.pathname.split('/').pop();
      } catch (_) { return null; }
    }

    function playVideoUrl(title, url, provider = 'youtube') {
      stopMusic();
      const modal = document.getElementById('video-modal');
      const frame = document.getElementById('video-frame');
      const tiktokVideo = document.getElementById('tiktok-video');
      const label = document.getElementById('video-title');
      if (!modal || !frame || !tiktokVideo) { showError('Video player not ready'); return; }
      const isShortVideo = provider === 'tiktok' || provider === 'shoti';
      if (isShortVideo) {
        frame.src = 'about:blank';
        frame.style.display = 'none';
        tiktokVideo.style.display = 'block';
        tiktokVideo.onended = () => stopVideo();
        tiktokVideo.onerror = () => {
          console.warn('TikTok direct play failed, trying server download…');
          const fallbackSrc = '/api/video/download?url=' + encodeURIComponent(url);
          if (tiktokVideo.src !== fallbackSrc) {
            tiktokVideo.onerror = () => {
              console.warn('TikTok server download also failed');
              showError('Video unavailable — try another');
              stopVideo();
            };
            tiktokVideo.src = fallbackSrc;
            tiktokVideo.load();
            tiktokVideo.play().catch(() => { showError('Video unavailable — try another'); stopVideo(); });
          } else {
            showError('Video unavailable — try another');
            stopVideo();
          }
        };
        tiktokVideo.src = url;
        tiktokVideo.load();
        tiktokVideo.play().catch(err => {
          console.warn('TikTok play() rejected:', err.message);
        });
      } else {
        const id = youtubeId(url);
        if (!id) { showError('Video URL is not valid'); return; }
        tiktokVideo.pause();
        tiktokVideo.removeAttribute('src');
        tiktokVideo.load();
        tiktokVideo.style.display = 'none';

    async function startFaceTracking() {
      if (!('FaceDetector' in window)) { console.warn('[FaceTrack] API not available'); return; }
      try {
        _ftStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        _ftVideo = document.createElement('video');
        _ftVideo.srcObject = _ftStream;
        _ftVideo.playsInline = true;
        _ftVideo.muted = true;
        await _ftVideo.play();
        const detector = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
        _ftZoneV = null; _ftZoneH = null; _ftNoFace = 0;
        console.log('[FaceTrack] started');

        function loop() {
          if (!_ftStream) return;
          detector.detect(_ftVideo).then(faces => {
            if (faces.length > 0) {
              _ftNoFace = 0;
              const box = faces[0].boundingBox;
              const vw = _ftVideo.videoWidth || 320;
              const vh = _ftVideo.videoHeight || 240;
              const cx = (box.x + box.width / 2) / vw;
              const cy = (box.y + box.height / 2) / vh;
              const zv = cy < 0.38 ? 'UP' : cy > 0.62 ? 'DOWN' : 'CENTER';
              if (zv !== _ftZoneV) {
                _ftZoneV = zv;
                sendBLECommand(zv === 'UP' ? 'LOOK_UP' : zv === 'DOWN' ? 'LOOK_DOWN' : 'LOOK_CENTER');
              }
              const zh = cx < 0.30 ? 'LEFT' : cx > 0.70 ? 'RIGHT' : 'CENTER';
              if (zh !== 'CENTER' && zh !== _ftZoneH && Date.now() > _ftHCooldown) {
                _ftZoneH = zh;
                _ftHCooldown = Date.now() + 800;
                sendBLECommand(zh);
              } else if (zh === 'CENTER') {
                _ftZoneH = 'CENTER';
              }
            } else {
              _ftNoFace++;
              if (_ftNoFace > 15) {
                _ftNoFace = 0;
                if (_ftZoneV !== 'CENTER') { _ftZoneV = 'CENTER'; sendBLECommand('LOOK_CENTER'); }
              }
            }
          }).catch(() => {}).finally(() => {
            if (_ftStream) _ftTimer = setTimeout(loop, 200);
          });
        }
        loop();
      } catch (err) { console.warn('[FaceTrack] camera error:', err.message); }

    function sendBLECommand(cmd) {

    const NUM_BARS = 7;

async function initAudio() {
      // Detect Android — getUserMedia with WebRTC processing constraints triggers
      // Android MODE_IN_COMMUNICATION (call mode), hijacking volume to the call channel.
      // Fix: disable those constraints on Android so it stays in media mode.
      const isAndroid = /android/i.test(navigator.userAgent);

      // 1. Set AudioSession to play-and-record (correct type for mic + playback apps).
      //    'playback' alone can conflict with mic acquisition on some browsers.
      if ('audioSession' in navigator) {
        try {
          navigator.audioSession.type = 'play-and-record';
        } catch (_) {}
      }

      audioCtx = new (window.AudioContext || window.webkitAudioContext)({
        latencyHint: 'interactive'
      });
      try { await audioCtx.resume(); } catch (_) {}

      // 2. On Android, disable WebRTC audio-processing constraints.
      //    echoCancellation/noiseSuppression/autoGainControl force Android into
      //    MODE_IN_COMMUNICATION, which switches volume control to the call channel.
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: isAndroid ? {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1
        } : {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1,
          sampleRate: 16000
        }
      });

      // 3. Re-assert play-and-record after mic is open
      if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'play-and-record'; } catch (_) {}
      }

      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.5;
      source.connect(analyser);
      initGeminiLive(source);
    }

    function getRMS() {
      const buf = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      return Math.sqrt(sum / buf.length);
    }

    // ── GEMINI LIVE VOICE PIPELINE ───────────────────────────────
    let geminiWs = null;
    let geminiNextStart = 0;
    let playbackGeneration = 0;

    function connectGeminiLive() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      geminiWs = new WebSocket(`${proto}://${location.host}/ws/gemini`);

      geminiWs.onopen = () => console.log('[GeminiLive] connected');

      geminiWs.onmessage = async ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { return; }

        if (msg.setupComplete !== undefined) {
          showTranscript('🔴 Gemini Live ready — speak to Mochi!');
          return;
        }
        if (msg.error) { showError('Gemini: ' + msg.error); robotState = 'IDLE'; return; }

        // Server asks for a photo (vision tool)
        if (msg.needPhoto) {
          robotState = 'THINKING';
          currentExpression = 'CAMERA';
          showTranscript('📸 Taking a look...');
          const photo = await capturePhotoSilent();
          if (photo && geminiWs?.readyState === WebSocket.OPEN) {
            geminiWs.send(JSON.stringify({ photoData: photo.replace(/^data:image\/\w+;base64,/, ''), toolCallId: msg.toolCallId }));
          } else if (geminiWs?.readyState === WebSocket.OPEN) {
            geminiWs.send(JSON.stringify({ photoData: '', toolCallId: msg.toolCallId }));
          }
          return;
        }

        // Server asks for navigation
        if (msg.needNavigate) {
          await navigateToTarget(msg.target, msg.toolCallId);
          return;
        }

        // Robot action from run_scenario
        if (msg.robotAction) {
          const { face, move, led } = msg.robotAction;
          if (face) {
            currentExpression = face;
            if (face === 'CAMERA') triggerCameraCapture();
          }
          sendDirectionalMove(move || 'NONE');
          if (led && led !== 'NONE') sendBLECommand(led);
          return;
        }

        // Interruption / cancellation
               if (msg.toolCancelled) {
          playbackGeneration++;
          geminiNextStart = 0;
          activeAudioSources.forEach(src => { try { src.stop(); } catch {} });
          activeAudioSources = [];
          robotState = 'LISTENING';
          currentExpression = 'IDLE';
          return;
        }
        // Media loading
        if (msg.mediaAction) {
          const labels = { music: '🎵 Searching music…', video: '🎬 Searching video…', tiktok: '📱 Searching TikTok…', shoti: '🎀 Fetching shoti…' };
          showTranscript(labels[msg.mediaAction.type] || '🔍 Loading…');
          return;
        }

        // Media ready
        if (msg.mediaReady) {
          const { type, url, title, provider } = msg.mediaReady;
          if (!url) { showError('Media not found'); return; }
          if (type === 'music') playMusicUrl(title || 'Music', url);
          else playVideoUrl(title || 'Video', url, provider || type);
          return;
        }

        const sc = msg.serverContent;
        if (!sc) return;

        // Log user speech to console only — NOT on screen
        if (sc.inputTranscription?.text) {
          const t = sc.inputTranscription.text.trim();
          if (t) { console.log('[User]', t); robotState = 'THINKING'; }
        }

        if (sc.modelTurn?.parts) {
          for (const part of sc.modelTurn.parts) {
            if (part.inlineData?.mimeType?.startsWith('audio/pcm')) {
              robotState = 'SPEAKING';
              _playGeminiChunk(part.inlineData.data, playbackGeneration);
            }
            if (typeof part.text === 'string') {
              console.log('[Gemini]', part.text);
            }
          }
        }

              if (sc.interrupted) {
          playbackGeneration++;
          geminiNextStart = 0;
          activeAudioSources.forEach(src => { try { src.stop(); } catch {} });
          activeAudioSources = [];
          robotState = 'LISTENING';
          currentExpression = 'IDLE';
        }
        if (sc.turnComplete) {
          const delay = Math.max(0, (geminiNextStart - audioCtx.currentTime) * 1000 + 300);
          setTimeout(() => {
            if (robotState === 'SPEAKING') {
              robotState = 'IDLE'; currentExpression = 'IDLE'; mouthOpen = 0; mouthTarget = 0;
            }
          }, delay);
        }
      };

      geminiWs.onclose = ({ code, reason }) => {
        console.log('[GeminiLive] closed', code, reason?.toString?.() ?? '');
        robotState = 'IDLE'; geminiWs = null;
        setTimeout(connectGeminiLive, 3000);
      };
      geminiWs.onerror = (e) => console.error('[GeminiLive] error', e);
    }

    function _playGeminiChunk(b64, gen) {
      if (gen !== playbackGeneration) return;
      const raw = atob(b64);
      const i16 = new Int16Array(raw.length / 2);
      for (let i = 0; i < i16.length; i++)
        i16[i] = (raw.charCodeAt(i * 2) & 0xff) | ((raw.charCodeAt(i * 2 + 1) & 0xff) << 8);
      const f32 = new Float32Array(i16.length);
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768.0;

      const buf = audioCtx.createBuffer(1, f32.length, 24000);
      buf.copyToChannel(f32, 0);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      const start = Math.max(now + 0.01, geminiNextStart);
            src.start(start);
      geminiNextStart = start + buf.duration;

      activeAudioSources.push(src);
           src.onended = () => {
        const idx = activeAudioSources.indexOf(src);
        if (idx !== -1) activeAudioSources.splice(idx, 1);
        if (audioCtx.currentTime >= geminiNextStart - 0.08 && robotState === 'SPEAKING') {
          robotState = 'IDLE'; currentExpression = 'IDLE'; mouthOpen = 0; mouthTarget = 0;
        }
      };    // ← isara ang callback dito
    }       // ← isara ang function dito

    function initGeminiLive(source) {
      const SR = audioCtx.sampleRate, TR = 16000;
      const proc = audioCtx.createScriptProcessor(4096, 1, 1);
      const sink = audioCtx.createMediaStreamDestination();
      source.connect(proc);
      proc.connect(sink);

      let vadReady = false;
      setTimeout(() => { vadReady = true; }, 1500);

      proc.onaudioprocess = (e) => {
        const input = e.inputBuffer.getChannelData(0);
        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        smoothedVolume = smoothedVolume * 0.7 + Math.sqrt(sum / input.length) * 0.3;

        // ALWAYS stream to Gemini unless local media is playing (prevents feeding video audio back)
        // We removed geminiMuted so the user can interrupt AI speech anytime.
        if (!vadReady || isMediaPlaying || !geminiWs || geminiWs.readyState !== WebSocket.OPEN) return;

        const ratio = SR / TR, outLen = Math.floor(input.length / ratio);
        const pcm = new Int16Array(outLen);
        for (let i = 0; i < outLen; i++) {
          const pos = i * ratio, idx = Math.floor(pos), frac = pos - idx;
          const s = Math.max(-1, Math.min(1, (input[idx] || 0) + frac * ((input[idx + 1] || 0) - (input[idx] || 0))));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        geminiWs.send(pcm.buffer);
        if (robotState === 'IDLE') robotState = 'LISTENING';
      };

      connectGeminiLive();
      console.log('[GeminiLive] audio pipeline ready, sampleRate:', SR);
    }

    // ── TTS fallback ──────────────────────────────────────────────
    async function playTTS(text) {
      let played = false;
      try {
        const streamUrl = '/api/tts/stream?text=' + encodeURIComponent(text);
        if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
        await new Promise((resolve, reject) => {
          const ttsEl = new Audio();
          ttsEl.playsInline = true;
          ttsEl.preload = 'auto';
          try {
            const ttsSrc = audioCtx.createMediaElementSource(ttsEl);
            const ttsGain = audioCtx.createGain();
            ttsAnalyser = audioCtx.createAnalyser();
            ttsAnalyser.fftSize = 256;
            ttsAnalyser.smoothingTimeConstant = 0.4;
            ttsSrc.connect(ttsAnalyser);
            ttsAnalyser.connect(ttsGain);
            ttsGain.connect(audioCtx.destination);
          } catch (routeErr) {
            console.warn('AudioContext routing skipped:', routeErr.message);
            ttsAnalyser = null;
          }
          ttsEl.onended = () => { mouthOpen = 0; mouthTarget = 0; ttsAnalyser = null; resolve(); };
          ttsEl.onerror = (e) => { ttsAnalyser = null; reject(e); };
          ttsEl.src = streamUrl;
          ttsEl.play().catch(reject);
        });
        played = true;
      } catch (err) {
        console.warn('Edge TTS failed, using Web Speech:', err.message);
      }
      if (!played) {
        await new Promise(resolve => {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.rate = 1.05; utter.pitch = 1.1;
          const voices = window.speechSynthesis.getVoices();
          const pick = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('female'))
                    || voices.find(v => v.lang.startsWith('en')) || voices[0];
          if (pick) utter.voice = pick;
          utter.onend = resolve; utter.onerror = resolve;
          window.speechSynthesis.speak(utter);
        });
      }
    }

    // ── MOUTH ANIMATION ───────────────────────────────────────────
    let mouthOpen = 0;

    function updateMouth() {
      if (robotState === 'SPEAKING' && ttsAnalyser) {
        if (!_ttsTDBuf) _ttsTDBuf = new Float32Array(ttsAnalyser.fftSize);

    function drawCuteMouth(cx, cy) {
      const isEating = (currentExpression === 'BURGER' || currentExpression === 'JUICE');
      if (robotState !== 'SPEAKING' && !isEating) return;
      const my = cy + 125;

    // ── BLINK / WINK / GAZE ─────────────────────────────────────
    let nextBlinkAt = Date.now() + 1500 + Math.random() * 2500;
    let blinkStartAt = 0;
    const BLINK_DUR = 220;

    function getBlinkScale() {
      const now = Date.now();
      if (blinkStartAt === 0 && now >= nextBlinkAt) {
        blinkStartAt = now;
        nextBlinkAt = now + BLINK_DUR + 2000 + Math.random() * 3000;
      }
      if (blinkStartAt === 0) return 1.0;
      const elapsed = now - blinkStartAt;
      if (elapsed >= BLINK_DUR) { blinkStartAt = 0; return 1.0; }
      const progress = elapsed / BLINK_DUR;
      return 0.05 + 0.95 * Math.abs(Math.cos(progress * Math.PI));
    }

    let winkProgress = 0;
    let winkPhase = 'none';
    let winkHoldTimer = 0;

    function updateWink() {
      const winkRequested = (currentExpression === 'WINK');
      if (winkRequested && winkPhase === 'none') winkPhase = 'closing';
      if (winkPhase === 'closing') {
        winkProgress += 0.08;
        if (winkProgress >= 1) { winkProgress = 1; winkPhase = 'held'; winkHoldTimer = 30; }
      } else if (winkPhase === 'held') {
        if (--winkHoldTimer <= 0) winkPhase = 'opening';
      } else if (winkPhase === 'opening') {
        winkProgress -= 0.08;

          h = 5 + 18 * Math.abs(Math.sin(t * 5 + i * 1.1)) + 8 * Math.abs(Math.sin(t * 9.3 + i * 0.6));
          color = '#ffbc00';
        } else if (robotState === 'THINKING') {
          h = 6 + Math.abs(Math.sin(t + i * 0.7)) * 22;
          color = '#00d2ff';
        } else if (robotState === 'LISTENING') {
          h = 4 + vol * 30 * Math.abs(Math.sin(t * 8 + i * 0.9));
          h = Math.max(4, h);
          color = '#00ff99';
        } else if (robotState === 'SPEAKING') {
          h = 6 + Math.abs(Math.sin(t * 1.5 + i * 0.9)) * 18;
          color = '#00d2ff';
        } else {
          h = 3 + Math.abs(Math.sin(t * 0.5 + i * 1.1)) * 3;
          color = '#00d2ff';
        }
        barHeights[i] = barHeights[i] * 0.5 + h * 0.5;
        b.style.height = barHeights[i] + 'px';
        b.style.background = color;
      });
    }

    // ── MAIN RENDER LOOP ────────────────────────────────────────
    function renderLoop() {
      updateWaveformUI();
      updateWink();
      updateGaze();
      if (cameraAnimPhase === 'raising' && Math.abs(cameraAnimY - cameraAnimTarget) < 2) {
        cameraAnimPhase = 'held';
        cameraAnimY = cameraAnimTarget;
      }

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const faceScale = Math.min(1, Math.max(0.35, (canvas.width - 24) / 640), Math.max(0.35, (canvas.height - 24) / 560));
      const eyeRadius = 90;
      const eyeOffset = 220;
      const blinkScale = getBlinkScale();

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.scale(faceScale, faceScale);
      ctx.save();
      ctx.translate(gazeX, gazeY);

      if (currentExpression === 'MUSIC') drawHeadphonesBack(0, 0, eyeOffset, eyeRadius);
      drawEye(-eyeOffset, 0, eyeRadius, true, blinkScale);
      drawEye(eyeOffset, 0, eyeRadius, false, blinkScale);
      if (currentExpression === 'MUSIC') drawHeadphonesFront(0, 0, eyeOffset, eyeRadius);

      updateMouth();
      drawCuteMouth(0, 0);
      ctx.restore();

      drawAccessories(0, 0);
      drawCameraAccessory(0, 0);
      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    function drawEye(x, y, r, isLeft, blinkScale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, blinkScale);
      const isHappyMode = (currentExpression === 'HAPPY');
      let cyanColor = '#3ad8ff';
      let darkBlue = '#121da0';
      if (currentExpression === 'ANGRY') { cyanColor = '#ff3a3a'; darkBlue = '#a01212'; }
      if (!isLeft && winkProgress > 0) ctx.scale(1, 1 - winkProgress * 0.95);
      if (currentExpression === 'SAD') {
        ctx.beginPath();
        ctx.arc(0, 15, r, Math.PI * 1.15, Math.PI * 1.85);
        ctx.lineWidth = 18;
        ctx.strokeStyle = cyanColor;
        ctx.shadowColor = cyanColor;
        ctx.shadowBlur = 14;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();
        return;
      }
      _drawNormalEye(r, cyanColor, darkBlue, isHappyMode);
      ctx.restore();
    }

    function _drawNormalEye(r, cyanColor, darkBlue, isHappyMode) {
      if (isHappyMode) {
        ctx.beginPath();
        ctx.arc(0, 10, r, Math.PI, 0, false);
        ctx.lineTo(r, 16);
        ctx.lineTo(-r, 16);
        ctx.closePath();
        ctx.fillStyle = darkBlue;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI, 0, false);
        ctx.lineTo(r, 4);
        ctx.lineTo(-r, 4);
        ctx.closePath();
        ctx.fillStyle = cyanColor;
        ctx.shadowColor = cyanColor;
        ctx.shadowBlur = 12;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 8, r, 0, Math.PI * 2);
        ctx.fillStyle = darkBlue;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = cyanColor;
        ctx.shadowColor = cyanColor;
        ctx.shadowBlur = 12;
        ctx.fill();
      }
    }

    function drawHeadphonesBack(cx, cy, eo, r) {
      ctx.save();
      const bandR = eo + r * 0.28;
      const bandCY = cy - r * 0.18;
      ctx.beginPath();
      ctx.arc(cx, bandCY, bandR, Math.PI * 1.06, Math.PI * -0.06, false);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 30;
      ctx.lineCap = 'round';
      ctx.filter = 'blur(4px)';
      ctx.stroke();
      ctx.filter = 'none';
      ctx.beginPath();
      ctx.arc(cx, bandCY, bandR, Math.PI * 1.06, Math.PI * -0.06, false);
      ctx.strokeStyle = '#1e1e1e';
      ctx.lineWidth = 24;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, bandCY, bandR, Math.PI * 1.06, Math.PI * -0.06, false);
      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 14;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, bandCY, bandR, Math.PI * 1.1, Math.PI * -0.1, false);
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      ctx.lineWidth = 5;
      ctx.stroke();

      [-1, 1].forEach(side => {
        const ex = cx + side * eo;
        ctx.save();
        ctx.translate(ex, cy);
        const cw = r * 1.62, ch = r * 1.58;
        ctx.beginPath();
        ctx.ellipse(0, 0, cw * 0.54, ch * 0.54, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.filter = 'blur(6px)';
        ctx.fill();
        ctx.filter = 'none';
        const g = ctx.createRadialGradient(-side * r * 0.12, -r * 0.12, r * 0.04, 0, 0, cw * 0.52);
        g.addColorStop(0, '#3c3c3c');
        g.addColorStop(0.55, '#1e1e1e');
        g.addColorStop(1, '#0d0d0d');
        ctx.beginPath();
        ctx.ellipse(0, 0, cw * 0.5, ch * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
      });
      ctx.restore();
    }

    function drawHeadphonesFront(cx, cy, eo, r) {
      const pulse = 0.65 + 0.35 * Math.sin(Date.now() * 0.0028);
      ctx.save();
      [-1, 1].forEach(side => {
        const ex = cx + side * eo;
        ctx.save();
        ctx.translate(ex, cy);
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.16, r * 1.13, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#140e1e';
        ctx.lineWidth = 22;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.1, r * 1.07, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#251830';
        ctx.lineWidth = 10;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.22, r * 1.19, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffbc00';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#ffbc00';
        ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.shadowBlur = 0;
        const cw = r * 1.62, ch = r * 1.58;
        ctx.beginPath();
        ctx.ellipse(0, 0, cw * 0.5, ch * 0.5, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(-side * r * 0.28, -r * 0.32, r * 0.32, r * 0.18, -0.45, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(side * r * 0.62, -r * 0.58, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,210,255,${pulse})`;
        ctx.shadowColor = '#00d2ff';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      });
      ctx.restore();
    }

    function drawAccessories(cx, cy) {
      const t = Date.now() * 0.005;
      if (currentExpression === 'BURGER') {
        ctx.save();
        const chewCycle = Math.sin(t * 2);
        const burgerY = cy + 90 + chewCycle * 8;
        ctx.font = '64px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const scale = 1 + chewCycle * 0.08;
        ctx.translate(cx, burgerY);
        ctx.scale(scale, scale);
        ctx.fillText('🍔', 0, 0);
        ctx.restore();
      } else if (currentExpression === 'JUICE') {
        ctx.save();
        const sipCycle = Math.cos(t * 2);
        const juiceY = cy + 95 + sipCycle * 5;
        ctx.font = '64px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.translate(cx, juiceY);
        ctx.fillText('🧃', 0, 0);
        ctx.restore();
      }
      if (currentExpression === 'NEWS') drawNewsMic(cx, cy);
    }

    function drawNewsMic(cx, cy) {
      ctx.save();
      ctx.translate(cx + 75, cy + 215);
      ctx.rotate(-0.3);
      const hw = 24, hh = 80;
      const hg = ctx.createLinearGradient(-hw / 2, 0, hw / 2, 0);
      hg.addColorStop(0, '#111'); hg.addColorStop(0.4, '#555'); hg.addColorStop(1, '#111');
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.roundRect(-hw / 2, 0, hw, hh, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const ry = 14 + i * 11;
        ctx.beginPath(); ctx.moveTo(-hw / 2 + 3, ry); ctx.lineTo(hw / 2 - 3, ry); ctx.stroke();
      }
      const by = hh * 0.3;
      ctx.fillStyle = '#c0392b';
      ctx.beginPath(); ctx.roundRect(-hw / 2, by, hw, 15, 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 7px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('NEWS', 0, by + 7.5);
      const cw = 27, ch = 50;
      const cg = ctx.createLinearGradient(-cw / 2, -ch, cw / 2, 0);
      cg.addColorStop(0, '#2a2a2a'); cg.addColorStop(0.5, '#888'); cg.addColorStop(1, '#3a3a3a');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.roundRect(-cw / 2, -ch, cw, ch, [14, 14, 0, 0]); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.8;
      for (let i = 0; i < 5; i++) {
        const ly = -ch + 9 + i * 9;
        const hw2 = (cw / 2 - 3) * Math.sin(((i + 1) / 6) * Math.PI);
        ctx.beginPath(); ctx.moveTo(-hw2, ly); ctx.lineTo(hw2, ly); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(0, -ch + 5); ctx.lineTo(0, -5); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.ellipse(-cw * 0.15, -ch * 0.6, cw * 0.2, ch * 0.2, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222'; ctx.fillRect(-cw / 2 - 2, -6, cw + 4, 10);
      ctx.fillStyle = '#666'; ctx.fillRect(-cw / 2, -4, cw, 6);
      ctx.restore();
    }
  </script>
